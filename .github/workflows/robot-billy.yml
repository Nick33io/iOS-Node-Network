name: robot-billy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r robot-billy/requirements.txt
      - run: PYTHONPATH=robot-billy/src python -m unittest discover -s robot-billy/tests -v
