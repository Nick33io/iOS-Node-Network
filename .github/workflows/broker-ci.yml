name: Broker CI

on:
  push:
    branches: [main]
    paths:
      - "broker/**"
      - ".github/workflows/broker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "broker/**"
      - ".github/workflows/broker-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test broker/
