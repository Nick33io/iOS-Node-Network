name: NodeNetwork
options:
  bundleIdPrefix: io.thirtythree
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  WriteKit:
    path: ..
  # Pinned exactly, matching the audited 33io plugin. The model revision is
  # pinned separately in MLXPolicy; neither follows a moving "latest".
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.3
  # Pinned explicitly: mlx-swift-lm's range would otherwise float this to a
  # version the 33io plugin never audited.
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.3
  # MLX Swift LM is provider-agnostic and ships no concrete Tokenizer. This
  # supplies the one the manifest's tokenizer.json is written for. Pinned for
  # the same reason as the rest: the tokenizer decides what the weights see.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.3

targets:
  # The fleet on the wrist. watchOS cannot run a model or join the tailnet, so
  # this is a display: it polls the Macs directly over Wi-Fi and shows whether
  # the fleet is working.
  #
  # Embedded in the iOS app rather than watch-only, because WCSession only ever
  # connects an iOS app to its OWN companion watch app. Standalone was the
  # nicer thing to iterate on, but it made the phone unreachable from the
  # wrist, and the phone is the only route to the fleet when the watch is off
  # the LAN. Direct polling stays primary — the phones are the least reliable
  # part of this fleet and the Macs are the part that stays up — so the link is
  # a fallback for when direct finds nothing, not a replacement for it.
  NodeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../WatchApp/Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Must be a suffix of the host app id, or watchOS will not treat the
        # two as companions and WCSession never activates.
        PRODUCT_BUNDLE_IDENTIFIER: io.thirtythree.nodenetwork.watchkitapp
        DEVELOPMENT_TEAM: VG8M5G3FF6
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundleDisplayName: NOD3 Pulse
    info:
      path: WatchInfo.plist
      properties:
        WKCompanionAppBundleIdentifier: io.thirtythree.nodenetwork
        # Cleartext to the fleet's LAN nodes, same posture as the iOS app: an
        # internal tool talking to machines the owner controls.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: >-
          Reads fleet status from NOD3 nodes on your network.

  NodeNetwork:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: WriteKit
        product: WriteCore
      - package: WriteKit
        product: WriteMesh
      - package: WriteKit
        product: WriteLAN
      # The listener, the request boundary, the fleet profile, the device
      # profile. Shared with the macOS NodeAgent so both nodes answer one
      # contract from one implementation.
      - package: WriteKit
        product: NodeKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Transformers
      # Embed Watch Content. Xcodegen knows a watchOS app belongs in Watch/;
      # the widget belongs in PlugIns/ and gets the default. They were briefly
      # transposed, which built a widget into the watch slot and shipped an app
      # with no widget at all.
      - target: NodeWatch
        embed: true
      - target: NodeNetworkWidgets
        embed: true
    entitlements:
      path: NodeNetwork.entitlements
      # XcodeGen generates this file from `properties` and overwrites whatever
      # is on disk. A path with no properties produced an empty <dict/>, so the
      # entitlement was silently absent even before signing could strip it.
      properties:
        # Roughly doubles the jetsam ceiling. Requires the matching capability
        # on the App ID — without it signing fails outright rather than
        # stripping the key quietly, which is the behaviour worth keeping: a
        # silent strip cost us several debugging rounds.
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: NOD3
        DEVELOPMENT_TEAM: VG8M5G3FF6
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: io.thirtythree.nodenetwork
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
    # MultipeerConnectivity refuses to advertise or browse unless the service
    # type is declared here as well. Both transports must be listed.
    info:
      path: Info.plist
      properties:
        NSBonjourServices:
          - _node33-mesh._tcp
          - _node33-mesh._udp
        NSLocalNetworkUsageDescription: >-
          Discovers nearby devices so they can share work in the node mesh.
        NSCameraUsageDescription: >-
          Renders the camera as an ambient glyph display. Frames are converted
          to characters on this device; no image is stored or sent.
        # Cleartext over the tailnet during development.
        #
        # A per-address exception cannot work here. The fleet is addressed by
        # tailnet IP, nodes can be added at runtime, and ATS has no wildcard
        # for an IP range — so pinning exceptions to known hosts silently
        # blocked every node except the one that happened to be listed, which
        # presented as "the fleet is offline" rather than as a config error.
        #
        # NSAllowsLocalNetworking does not cover it either: Tailscale hands out
        # 100.64.0.0/10 (CGNAT), which ATS does not treat as local.
        #
        # This is an internal fleet tool talking to machines the owner
        # controls. A shipped build reaches nodes over HTTPS through the broker
        # and drops this entirely.
        # NSAllowsLocalNetworking is deliberately absent. On iOS 10 and later,
        # setting any of the specific ATS keys (NSAllowsLocalNetworking,
        # NSAllowsArbitraryLoadsInWebContent, NSAllowsArbitraryLoadsForMedia)
        # makes the system IGNORE NSAllowsArbitraryLoads entirely and honour
        # only the specific ones. Having both reduced "allow everything" to
        # "allow local networking", which does not cover Tailscale's CGNAT
        # range — so every tailnet node kept failing with -1022 while the
        # plist looked permissive.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

# Declared explicitly: xcodegen stopped auto-generating per-target schemes at
# some point in this project's life, and xcodebuild cannot address a target's
# signed device build without one. Explicit is also versioned — the schemes
# can no longer silently vanish.
  # The fleet watched from a Mac. A viewer, never a worker: the Macs already
  # serve through NodeAgent under launchd, and a second process competing for
  # the same GPU would cost throughput in order to display throughput.
  NodeMonitor:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ../MacApp/Sources
      - path: ../Shared/Sources
      # Only the fleet model and the roster. NodeRole is the iOS idiom split
      # (iPad manages, phone works) and has no meaning on a Mac.
      - path: Sources/FleetManager.swift
      - path: Sources/KnownNodes.swift
      - path: Sources/LinkTest.swift
      # The per-node bar chart, shared verbatim with the iPad console so the
      # two read identically. Already free of UIKit.
      - path: Sources/ThroughputPanel.swift
    dependencies:
      - package: WriteKit
        product: NodeKit
      - target: NodeMonitorWidgets
        embed: true
    info:
      path: MonitorInfo.plist
      properties:
        # Cleartext to the fleet's nodes, the same posture as the iOS app and
        # the watch: an internal tool talking to machines the owner controls.
        # Without this, macOS ATS silently refused every probe and the monitor
        # showed the whole fleet down while the fleet was fine — the display
        # lied by omission, which is the exact failure this repo exists to
        # avoid.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.thirtythree.nodemonitor
        DEVELOPMENT_TEAM: VG8M5G3FF6
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: NodeMonitor.entitlements
      properties:
        # Reads the fleet over the LAN and the tailnet. Not sandboxed for
        # anything else: it writes no files and runs no models.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  NodeMonitorWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ../Widgets/Sources
      - path: ../Shared/Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.thirtythree.nodemonitor.widgets
        DEVELOPMENT_TEAM: VG8M5G3FF6
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        Release:
          INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    info:
      path: MonitorWidgets.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NodeMonitorWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  # Same widget on the phone and the iPad. The extra-large family is offered
  # only where it exists, which is iPad.
  NodeNetworkWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../Widgets/Sources
      - path: ../Shared/Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.thirtythree.nodenetwork.widgets
        DEVELOPMENT_TEAM: VG8M5G3FF6
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: NetworkWidgets.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  NodeNetwork:
    build:
      targets:
        NodeNetwork: all
    run:
      config: Debug
  NodeWatch:
    build:
      targets:
        NodeWatch: all
    run:
      config: Debug
  NodeMonitor:
    build:
      targets:
        NodeMonitor: all
    run:
      config: Debug
