name: NodeNetwork
options:
  bundleIdPrefix: io.thirtythree
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  WriteKit:
    path: ..
  # Pinned exactly, matching the audited 33io plugin. The model revision is
  # pinned separately in MLXPolicy; neither follows a moving "latest".
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.3
  # Pinned explicitly: mlx-swift-lm's range would otherwise float this to a
  # version the 33io plugin never audited.
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.3
  # MLX Swift LM is provider-agnostic and ships no concrete Tokenizer. This
  # supplies the one the manifest's tokenizer.json is written for. Pinned for
  # the same reason as the rest: the tokenizer decides what the weights see.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.3

targets:
  NodeNetwork:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: WriteKit
        product: WriteCore
      - package: WriteKit
        product: WriteMesh
      - package: WriteKit
        product: WriteLAN
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Transformers
    entitlements:
      path: NodeNetwork.entitlements
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: NOD3
        DEVELOPMENT_TEAM: VG8M5G3FF6
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: io.thirtythree.nodenetwork
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
    # MultipeerConnectivity refuses to advertise or browse unless the service
    # type is declared here as well. Both transports must be listed.
    info:
      path: Info.plist
      properties:
        NSBonjourServices:
          - _node33-mesh._tcp
          - _node33-mesh._udp
        NSLocalNetworkUsageDescription: >-
          Discovers nearby devices so they can share work in the node mesh.
        # Cleartext to the Mac's model server during development.
        #
        # NSAllowsLocalNetworking is not enough: it covers link-local, .local,
        # and RFC1918 ranges, but Tailscale hands out 100.64.0.0/10 (CGNAT),
        # which ATS does not treat as local. The tailnet address therefore
        # needs its own exception.
        #
        # A shipped build talks to the broker over HTTPS and drops all of this.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            100.73.112.15:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
